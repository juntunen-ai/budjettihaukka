name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Robustness eval (320 goldens, gate)
        run: python scripts/eval_robustness_suite.py --dataset data/evals/robustness_goldens.json

      - name: Semantic view column compatibility
        run: python scripts/test_semantic_view_column_compat.py

      - name: Schema drift detection tests
        run: python scripts/test_schema_drift_detection.py

      - name: BigQuery audit unit tests
        run: |
          python scripts/test_dq_semantic_mode.py
          python scripts/test_bigquery_operational_audit.py
          python scripts/test_bigquery_hf_backup.py

      - name: Concept code map validation
        run: python scripts/load_concept_code_map.py --validate-only

      - name: Concept code map runtime wiring
        run: python scripts/test_concept_code_map_runtime.py

      - name: Ontology loader validation
        run: python scripts/load_budget_ontology.py --match-question "Paljonko koulutukseen käytettiin rahaa 2023?"

      - name: Visualization pipeline eval
        run: python scripts/eval_visualization_pipeline.py

      - name: Visualization mart contract tests
        run: python scripts/test_visualization_data_mart.py

      - name: Official enrichment regression tests
        run: python scripts/test_official_enrichment_reference.py

      - name: Municipal finance semantic regression tests
        run: python scripts/test_municipal_finance_reference.py

      - name: SOTE demo data and narrative tests
        run: python scripts/test_sote_demo.py

      - name: Service value and regional visualization tests
        run: |
          python scripts/test_primary_care_value.py
          python scripts/test_vantaa_kerava_visualization.py
          python scripts/test_child_welfare_budget_reference.py
          python scripts/test_enrichment_visualization_demos.py
          python scripts/test_subsidy_name_search.py
          python scripts/test_firm_support_tax.py
          python scripts/test_state_supports_2025.py
          python scripts/test_government_cabinet.py
          python scripts/test_government_fiscal_eras.py
          python scripts/test_party_debt_cumulative.py
          python scripts/test_debt_speed_steps.py
          python scripts/test_gdp_growth_outlook.py
          python scripts/test_growth_debt_relation.py
          python scripts/test_debt_ratio_drivers.py
          python scripts/test_living_standard_index.py
          python scripts/test_living_standard_decomposition.py
          python scripts/test_population_projection.py
          python scripts/test_productivity_counterfactual.py
          python scripts/test_scenario_ai_displacement.py

      - name: UI no-crash smoke test
        run: python scripts/test_ui_no_crash_smoke.py

      - name: Analytics API contract
        run: python scripts/test_api_contract.py

  frontend-and-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit production dependencies
        run: npm --prefix frontend audit --omit=dev

      - name: Build Firebase frontend
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: ""
        run: npm --prefix frontend run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform -chdir=infra/firebase fmt -check -recursive

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/firebase init -backend=false
          terraform -chdir=infra/firebase validate
