# One-time lockfile refresh, restricted to the gRPC security fix branch.
# Remove this workflow from the branch after the generated lockfile is verified.
name: Regenerate patched gRPC lockfile

on:
  push:
    branches: [fix/grpc-js-security-2026-10]
    paths:
      - frontend/package.json
      - .github/workflows/refresh-grpc-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate lockfile without package scripts
        run: |
          npm --prefix frontend install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const l = require('./frontend/package-lock.json'); const v = l.packages['node_modules/@grpc/grpc-js']?.version; if (v !== '1.14.6') throw Error('Unexpected grpc-js resolution: ' + v);"

      - name: Commit reproducible lockfile on this feature branch
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "chore(deps): regenerate lockfile for patched grpc-js"
            git push origin HEAD:refs/heads/fix/grpc-js-security-2026-10
          fi
