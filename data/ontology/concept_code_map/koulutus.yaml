# Concept→budget-code map: KOULUTUS
#
# Source of authority: review dossier #1, decided by Harri Juntunen 2026-07-08.
# Verdicts: Q1 (opintotuki) = C  -> included as separable component
#           Q2 (tutkimus)   = A  -> Academy/science lines excluded, mapped to concept 'tutkimus'
#           Q3 (kunta-VOS)  = C  -> excluded now with standing disclosure; estimate view later
#           Q4 (muut haarat)= A  -> työvoimakoulutus/opiskelijaterveydenhuolto etc. excluded,
#                                   belong to their own concepts
#
# Rule semantics:
#   - momentti-level rules override luku-level rules
#   - years are inclusive; year_to: null = open-ended
#   - role: include | component | exclude
#   - component names a separable sub-aggregate (Q1:C)
#   - target_concept records where excluded money belongs, so those concepts
#     start pre-populated
concept: koulutus
label_fi: Koulutus
version: 1
decided_by: Harri Juntunen
decided_on: "2026-07-08"
source_dossier: review dossier #1 (claude.ai artifact koulutus-dossier-v1)
disclosure_fi: >-
  Luvut kuvaavat valtion talousarvion suoraa koulutusrahoitusta. Kuntien
  järjestämän varhaiskasvatuksen ja perusopetuksen rahoitus kulkee vuodesta
  2010 alkaen yleiskatteisen valtionosuuden (momentti 28.90.30) kautta eikä
  ole eriteltävissä budjettiaineistosta; se ei sisälly näihin lukuihin.
