disclosure_fi: >-
  Kattaa OKM:n hallinnonalan taide- ja kulttuurirahoituksen sekä
  muistiorganisaatiot (arkistot, museot, kirjastotoimi). Liikunta ja
  nuorisotyö eivät sisälly (omat käsitteensä). Kuntien kulttuuritoimen
  rahoitus kulkee yleiskatteisen valtionosuuden kautta eikä ole
  eriteltävissä budjettiaineistosta.
