# Concept→budget-code map: SOSIAALI- JA TERVEYSPALVELUT
#
# Lähde: katselmus-dossier #2, päätökset Harri Juntunen 2026-07-10.
# Verdiktit: K1 (hyvinvointialueet) = A -> mukaan komponenttina
#            K2 (sairausvakuutus)   = A -> mukaan komponenttina (COFOG-linjaus)
#            K3 (toimeentuloetuudet)= A -> pois, target sosiaaliturva
#            K4 (VOS-aukko 2010-22) = A -> pysyvä disclosure (ennakkotapaus
#                                          koulutus-dossier #1, Q3:C)
#
# Rajaus: PALVELUT (järjestäminen, korvaukset, hallinto, edistäminen) —
# rahansiirrot kotitalouksille kuuluvat sosiaaliturva-konseptiin.
concept: sosiaali_ja_terveys
label_fi: Sosiaali- ja terveyspalvelut
version: 1
decided_by: Harri Juntunen
decided_on: "2026-07-10"
source_dossier: review dossier #2 (claude.ai artifact sote-dossier-v1)
disclosure_fi: >-
  Luvut kuvaavat valtion talousarvion suoraa sote-palvelurahoitusta.
  Vuosina 2010-2022 kuntien sote-palvelujen valtionosuus kulki VM:n
  yleiskatteisen momentin (28.90.30) kautta eikä ole eriteltävissä; sarja
  näyttää noilta vuosilta vain STM:n suoran rahoituksen. Vuodesta 2023
  rahoitus kulkee hyvinvointialueiden kautta (momentti 28.89.31), joka
  sisältää myös pelastustoimen (~0,5 mrd €/v, ei eroteltavissa).
  Tasosiirtymät 2010 ja 2023 ovat rakenneuudistuksia, eivät meno-
  muutoksia.
