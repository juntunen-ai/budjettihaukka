    price_basis: not_applicable
    source_id: thl_sotkanet_indicator_4333
    sign_rule: Pienempi osuus tulkitaan paremmaksi tulokseksi.
    missing_means: THL ei ole julkaissut havaintoa; puuttuva ei tarkoita nollaa.
